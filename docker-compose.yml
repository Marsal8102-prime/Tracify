

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: tracify
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: tracify
    volumes:
      - db_data:/var/lib/postgresql/data
    # No host port mapping

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://tracify:change-me@db:5432/tracify
    ports:
      - "8000:8000"
    depends_on:
      - db
      - ml-engine

  ml-engine:
    build:
      context: .
      dockerfile: ml-engine/Dockerfile
    env_file:
      - .env
    ports:
      - "8001:8001"
    depends_on:
      - db

volumes:
  db_data:
